<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Romu Photographie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cadre">
        <header class="entete petit">
            <h1 class="titre">Portfolio</h1>
        </header>
        <nav>
            <ul class="bandeau">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="portfolio.html" aria-current="page">Portfolio</a></li>
                <li><a href="a-propos.html">À propos</a></li>
                <li><a href="location.html">Location</a></li>
            </ul>
        </nav>
        <main>
            <div class="filtres">
                <button class="actif" data-filtre="tous">Tous</button>
                <button data-filtre="mariage">Mariage</button>
                <button data-filtre="evenements">Événements</button>
                <button data-filtre="portraits">Portraits</button>
            </div>
            <div class="portfolio-grille">
                <figure data-cat="evenements"><img src="img/portfolio/evenement1.jpg" alt="Sport"><figcaption>Séance Foot Élite</figcaption></figure>
                <figure data-cat="evenements"><img src="img/portfolio/evenement2.jpg" alt="Sport"><figcaption>Intensité Sportive</figcaption></figure>
                <figure data-cat="evenements"><img src="img/portfolio/evenement3.jpg" alt="Sport"><figcaption>Pleine Extension</figcaption></figure>
                <figure data-cat="evenements"><img src="img/portfolio/evenement4.jpg" alt="Sport"><figcaption>Le Geste Parfait</figcaption></figure>
                <figure data-cat="portraits"><img src="img/portfolio/portrait2.jpg" alt="Portrait"><figcaption>Lumière Dorée</figcaption></figure>
            </div>
        </main>
    </div>
    <script>
        document.querySelectorAll('.filtres button').forEach(bouton => {
            bouton.addEventListener('click', () => {
                document.querySelector('.filtres button.actif').classList.remove('actif');
                bouton.classList.add('actif');
                const filtre = bouton.getAttribute('data-filtre');
                document.querySelectorAll('.portfolio-grille figure').forEach(item => {
                    if (filtre === 'tous' || item.getAttribute('data-cat') === filtre) item.style.display = 'block';
                    else item.style.display = 'none';
                });
            });
        });
    </script>
</body>
</html>
